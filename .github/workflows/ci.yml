name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The library is where all the logic lives; main.rs is a thin CLI shell
      # over it and is excluded so the number means something.
      #
      # The gate is 99, not 100, for one honest reason: `#[derive(InputObject)]`
      # on CreateVoucherInput generates a function with no reachable call site
      # (it exists for Apollo Federation SDL export, which this server does not
      # do). That single line is the only uncovered one; every hand-written line
      # in the crate is exercised. Stable Rust has no way to mark generated code
      # as out of scope, so the threshold absorbs it rather than the project
      # pretending otherwise.
      - name: Measure
        run: |
          cargo llvm-cov --all-features --locked \
            --ignore-filename-regex 'src/main\.rs' \
            --fail-under-lines 99 \
            --show-missing-lines \
            --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov
          path: lcov.info

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No tagged release runs on node24 yet (v2.0.0 is node20, which the
      # runner now force-upgrades and warns about). Pinned to the commit
      # that fixed it; move back to a tag once one ships.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, node24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: image
    needs: [test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      # Branch and sha tags only. Versioned tags and `latest` come from the
      # release pipeline — see .github/workflows/release-please.yml.
      push: ${{ github.event_name != 'pull_request' }}
