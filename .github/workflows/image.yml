name: image

# The image build lives here so CI and the release pipeline share one
# definition. Called, never triggered directly.
on:
  workflow_call:
    inputs:
      push:
        description: Push to GHCR. False for pull requests.
        type: boolean
        default: false
      version:
        description: >
          Release version without the leading v, e.g. 1.2.3. Set only by the
          release pipeline; an empty value produces a branch/sha build.
        type: string
        default: ''

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # No ref: on a release run this workflow is called from the push that
      # release-please tagged, so the default checkout is already that commit.
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is moved deliberately below, only by a real release, so a
          # push to main can never become what `docker compose up` pulls.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets anyone verify that a pulled image really came from this repo and
      # this commit — the whole premise is "do not just trust us".
      - name: Attest provenance
        if: inputs.push
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
