[package]
name = "unifi-voucher-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A scoped, auditable proxy for the UniFi Network Integration API. Holds your full-control API key so apps never see it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sushidev-team/unifi-voucher-proxy"
readme = "README.md"
keywords = ["unifi", "ubiquiti", "voucher", "proxy", "hotspot"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Builds the local fake controller. Off by default on purpose: `cargo build`
# produces exactly one binary, so "what does this thing do" has one answer and
# the release image carries no code that fabricates responses.
testing = ["dep:rcgen", "dep:axum-server"]

[[bin]]
name = "unifi-voucher-proxy"
path = "src/main.rs"

[[bin]]
name = "fake-controller"
path = "src/bin/fake_controller.rs"
required-features = ["testing"]

[dependencies]
axum = "0.8"
async-graphql = { version = "7", default-features = false, features = ["graphiql"] }
async-graphql-axum = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core", "alloc"] }
subtle = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
governor = "0.7"
rcgen = { version = "0.13", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"], optional = true }
humantime-serde = "1"
time = { version = "0.3", features = ["std", "parsing", "formatting", "serde-well-known", "macros"] }
toml_edit = "0.22"
arc-swap = "1"

[dev-dependencies]
axum-test = "17"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

# Everyday builds: CI, pull requests, `cargo build --release`, and the branch
# images. Small (opt-level "z" is both smaller and faster to compile than 2
# here) but without the LTO link that dominates build time.
[profile.release]
opt-level = "z"
panic = "abort"
strip = true

# What actually ships. Fat LTO is worth ~2.6 MiB of binary and costs ~30s of
# link time on every build — a good trade once per release, a bad one per
# commit. codegen-units = 1 is in for the last 229 KiB; it is nearly free.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
