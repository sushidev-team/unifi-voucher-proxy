# unifi-voucher-proxy — example configuration
#
# Copy to config.toml and edit. Anything here can also come from the
# environment: UVP_ + the path in caps with __ between levels, e.g.
# UVP_CONTROLLER__API_KEY. Env wins over the file, which is how you keep the
# controller key out of version control and backups.

[server]
bind = "0.0.0.0:8080"
upstream_timeout = "15s"
max_body_bytes = 65536

[controller]
# Your UniFi console. Scheme optional.
host = "192.168.1.1"

# The full-control Integration API key (Network -> Control Plane -> Integrations).
# Prefer passing this as UVP_CONTROLLER__API_KEY instead of writing it here.
api_key = ""

[controller.tls]
# UniFi consoles ship a self-signed certificate, so ordinary verification fails.
# Pin it instead: run
#     unifi-voucher-proxy fetch-fingerprint --host 192.168.1.1
# and paste the result. This is what stops anyone on your LAN from impersonating
# the controller and collecting the API key.
fingerprint_sha256 = ""

# A list is accepted too, when one console legitimately answers with more than
# one certificate — UniFi OS serves a different leaf depending on the name it is
# reached by, and during a planned rotation the old and the new one are both
# valid for a while:
#
#     fingerprint_sha256 = ["064d0b67…", "54071a43…"]
#
# Every entry is still an exact pin. A list widens *which* certificates are
# accepted, never *whether* they are checked — so only add one you have actually
# verified belongs to your console.

# Only for first-run discovery. Leave false.
# insecure_skip_verify = false

# Silence the warning that insecure_skip_verify prints on every start. Nothing
# else changes: the certificate is still not verified, and anything that can
# answer on the controller's address still receives the API key. This only stops
# the reminder, for an operator who has weighed that and does not want it in the
# log each restart. No effect unless insecure_skip_verify is on.
# silence_insecure_warning = false

# Permit an http:// controller URL, i.e. no TLS at all. A UniFi console always
# speaks HTTPS, so the only sane use is a TLS-terminating sidecar on this host.
# Without this a plaintext host is refused at startup, because an unencrypted
# hop would put the full-control API key on the wire.
# allow_plaintext = false

# Ceilings that apply to every token. A token may tighten these, never raise them.
[limits]
max_vouchers_per_request = 10
max_validity_minutes = 43200   # 30 days
rate_limit_per_minute = 60     # 0 disables

# Requests per minute per client IP, charged *before* authentication. Checking a
# token runs Argon2 against every configured hash and a wrong token is never
# cached, so this is what stops an unauthenticated caller from deciding how much
# CPU the machine spends. It keys on the peer address: behind a reverse proxy
# every client shares one, so let that proxy do this instead and set 0 here.
rate_limit_per_ip_per_minute = 120

# One entry per client device. Generate with:
#     unifi-voucher-proxy hash-token --name kitchen-ipad
# The token itself is printed once and only its Argon2id hash is stored here, so
# a stolen config file does not hand over working credentials.
[[tokens]]
name = "reception-iphone"
hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME"
# List real site ids where you can — a token scoped to one site cannot even see
# that the others exist.
sites = ["*"]
scopes = ["sites:read", "vouchers:read", "vouchers:create", "vouchers:revoke"]
# Optional per-token tightening:
# max_vouchers_per_request = 5
# max_validity_minutes = 1440
# rate_limit_per_minute = 20

# A display that only needs to show existing vouchers:
# [[tokens]]
# name = "lobby-display"
# hash = "$argon2id$..."
# sites = ["66c2f1e9-4b3a-4f21-9d0e-1a2b3c4d5e6f"]
# scopes = ["vouchers:read"]
